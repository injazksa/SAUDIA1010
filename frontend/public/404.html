  <style>
    .sv-error-page{min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(145deg,#f4f7fb,#fff)}
    .sv-error-card{width:min(720px,100%);padding:clamp(32px,7vw,76px);text-align:center;background:#fff;border:1px solid #e7ebf2;border-radius:24px;box-shadow:0 20px 60px rgba(14,36,64,.12)}

    .sv-error-card p{max-width:560px;margin:0 auto 28px;color:#5c6877;font-size:17px;line-height:1.9}
    .sv-error-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
    .sv-error-links a{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:10px;background:#112b46;color:#fff;text-decoration:none;font-weight:700}
    .sv-error-links a.secondary{background:#f1f4f8;color:#112b46}
    .sv-error-links a:hover,.sv-error-links a:focus-visible{filter:brightness(1.08);text-decoration:underline}
  </style>
</head>

  <main class="sv-error-page">
